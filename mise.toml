[tools]
java = "temurin-21"

[tasks.build]
description = "Build the distribution archive"
run = "./gradlew dist"

[tasks.test]
description = "Run the unit tests"
run = "./gradlew test"

[tasks."test:integration"]
description = "Run the integration tests, with and without postgres (needs docker)"
run = "./gradlew integrationTest"

[tasks.check]
description = "Run all tests"
run = "./gradlew check"
