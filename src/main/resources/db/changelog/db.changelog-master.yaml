databaseChangeLog:
  - changeSet:
      id: visits
      author: blcks
      changes:
        - createTable:
            tableName: visits
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: visited_at
                  type: timestamptz
                  constraints:
                    nullable: false
